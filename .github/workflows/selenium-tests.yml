name: Banking Selenium Tests
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 7 * * 1-5' }]
jobs:
  selenium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }
      - run: mvn clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: surefire-reports, path: target/surefire-reports/ }
